<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downloads</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .dl { display: flex; align-items: center; gap: 16px; padding: 16px 14px 16px 18px; border-top: 1px solid var(--line); }
    .dl:first-child { border-top: 0; }
    .file-icon {
      display: grid; place-items: center; flex: none;
      width: 42px; height: 42px; border-radius: 10px;
      background: #2a2a30; color: var(--text-2);
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    }
    .dl .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .dl .name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl .name.gone { text-decoration: line-through; color: var(--muted); }
    .dl a.name:hover { text-decoration: underline; cursor: pointer; }
    .dl .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl .meta.failed { color: var(--danger); }
    .bar { height: 4px; border-radius: 4px; background: #2e2e34; overflow: hidden; margin-top: 4px; }
    .bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s ease; }
    .bar.indeterminate span { width: 30% !important; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .dl .buttons { display: flex; gap: 6px; flex: none; }
    .dl .btn { height: 32px; padding: 0 12px; font-size: 13px; }
  </style>
</head>
<body>
  <nav class="side">
    <div class="brand"><img src="logo.png" alt="">bro!</div>
    <a href="history.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</a>
    <a href="bookmarks.html"><svg viewBox="0 0 24 24"><path d="M7 4.5h10v15.5l-5-3.8-5 3.8z"/></svg>Bookmarks</a>
    <a href="downloads.html"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>Downloads</a>
    <a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg>Settings</a>
  </nav>

  <main>
    <div class="head">
      <h1>Downloads</h1>
      <input class="search" id="q" type="search" placeholder="Search downloads" autocomplete="off" spellcheck="false">
      <button class="btn" id="clear">Clear list</button>
    </div>
    <div id="out"></div>
  </main>

  <script src="common.js"></script>
  <script>
    const out = document.getElementById('out');
    const q = document.getElementById('q');
    let items = [];
    const act = (id, action) => bro.send('download', { id, action });

    function ext(name) {
      const m = /\.([a-z0-9]{1,5})$/i.exec(name || '');
      return m ? m[1].toUpperCase() : 'FILE';
    }

    function meta(d) {
      const host = hostOf(d.url);
      switch (d.state) {
        case 'inProgress':
          return d.total > 0
            ? `${formatBytes(d.received)} of ${formatBytes(d.total)} · ${Math.floor(d.received / d.total * 100)}% · ${host}`
            : `${formatBytes(d.received)} · ${host}`;
        case 'paused': return `Paused · ${formatBytes(d.received)}${d.total > 0 ? ' of ' + formatBytes(d.total) : ''} · ${host}`;
        case 'completed': return `${d.exists ? formatBytes(d.total > 0 ? d.total : d.received) : 'Deleted'} · ${host}`;
        case 'cancelled': return `Cancelled · ${host}`;
        default: return `Failed · ${host}`;
      }
    }

    function render() {
      const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const shown = items.filter((d) => words.every((w) => (d.name + ' ' + d.url).toLowerCase().includes(w)));
      out.replaceChildren();
      if (shown.length === 0) {
        out.append(el('div', { class: 'empty' },
          el('b', {}, words.length ? 'No matches' : 'No downloads yet'),
          words.length ? 'Try a different word.' : 'Files you download will show up here.'));
        return;
      }
      let list = null, lastDay = '';
      for (const d of shown) {
        const day = dayLabel(d.started);
        if (day !== lastDay) { lastDay = day; list = el('div', { class: 'list' }); out.append(el('h2', {}, day), list); }

        const running = d.state === 'inProgress' || d.state === 'paused';
        const name = d.exists
          ? el('a', { class: 'name', title: d.path, onclick: () => act(d.id, 'open') }, d.name)
          : el('span', { class: `name ${d.state === 'completed' ? 'gone' : ''}`, title: d.path }, d.name || d.url);
        const info = el('div', { class: 'info' }, name,
          el('span', { class: `meta ${d.state === 'failed' ? 'failed' : ''}` }, meta(d)));
        if (running) {
          const bar = el('div', { class: `bar ${d.total > 0 ? '' : 'indeterminate'}` }, el('span'));
          bar.firstChild.style.width = d.total > 0 ? `${(d.received / d.total) * 100}%` : '30%';
          info.append(bar);
        }

        const buttons = el('div', { class: 'buttons' });
        if (d.state === 'inProgress') buttons.append(el('button', { class: 'btn', onclick: () => act(d.id, 'pause') }, 'Pause'));
        if ((d.state === 'paused' || d.state === 'failed') && d.canResume)
          buttons.append(el('button', { class: 'btn primary', onclick: () => act(d.id, 'resume') }, 'Resume'));
        if (running) buttons.append(el('button', { class: 'btn danger', onclick: () => act(d.id, 'cancel') }, 'Cancel'));
        if (d.exists) buttons.append(el('button', { class: 'btn', onclick: () => act(d.id, 'show') }, 'Show in folder'));
        if (!running) buttons.append(iconButton('x', 'Remove from list', () => act(d.id, 'remove')));

        list.append(el('div', { class: 'dl' }, el('div', { class: 'file-icon' }, ext(d.name)), info, buttons));
      }
    }

    bro.on('downloads', (m) => { items = m.items; render(); });
    q.addEventListener('input', render);
    document.getElementById('clear').addEventListener('click', () => bro.send('clearDownloads'));
    bro.get('settings', 'downloads');
    render();
  </script>
</body>
</html>
