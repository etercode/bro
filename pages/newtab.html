<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New tab</title>
  <style>
    :root {
      color-scheme: dark;
      --base: #131116;
      --ember: #1e66f5;   /* Bro accent */
      --plum: #5b2f7a;
      --tide: #1d5f6b;
      --sand: #f0b27a;
      --accent: #1e66f5;
    }
    body.private { --base: #110e17; }
    body.private .b1 { background: radial-gradient(circle, rgba(155, 108, 240, .45), transparent 62%); }
    body.private .b3 { background: radial-gradient(circle, rgba(60, 45, 120, .6), transparent 62%); }
    body.private .b4 { background: radial-gradient(circle, rgba(200, 160, 255, .18), transparent 65%); }
    body.no-clock .greeting, body.no-clock .time, body.no-clock .date { display: none; }
    body.no-clock .marks { margin-top: 0; }

    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--base);
      color: #f4ede6;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      user-select: none;
      display: grid;
      place-items: center;
    }

    /* Soft colour fields that slowly drift. Only transforms animate, so it stays light on the GPU. */
    .field { position: fixed; inset: 0; overflow: hidden; }
    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      animation: var(--anim) ease-in-out infinite alternate;
    }
    .b1 {
      width: 70vmax; height: 70vmax; left: -18vmax; top: -22vmax;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 62%);
      --anim: drift-a 24s;
    }
    .b2 {
      width: 80vmax; height: 80vmax; right: -30vmax; top: -10vmax;
      background: radial-gradient(circle, rgba(91, 47, 122, .6), transparent 64%);
      --anim: drift-b 30s;
    }
    .b3 {
      width: 75vmax; height: 75vmax; left: 5vmax; bottom: -45vmax;
      background: radial-gradient(circle, rgba(29, 95, 107, .55), transparent 62%);
      --anim: drift-c 27s;
    }
    .b4 {
      width: 34vmax; height: 34vmax; left: 46%; top: 38%;
      background: radial-gradient(circle, rgba(24, 224, 240, .16), transparent 65%);
      --anim: drift-d 19s;
    }

    @keyframes drift-a { to { transform: translate(22vmax, 14vmax) scale(1.15); } }
    @keyframes drift-b { to { transform: translate(-18vmax, 20vmax) scale(.9); } }
    @keyframes drift-c { to { transform: translate(24vmax, -16vmax) scale(1.1); } }
    @keyframes drift-d { to { transform: translate(-28vmax, -12vmax) scale(1.3); } }

    /* Fine film grain + darker edges */
    .grain {
      position: fixed; inset: 0; opacity: .14; mix-blend-mode: overlay; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(8, 6, 10, .7));
    }

    main { position: relative; text-align: center; }
    .greeting {
      font-size: 15px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(244, 237, 230, .62);
    }
    .time {
      margin-top: 6px;
      font-size: clamp(80px, 12vw, 168px);
      font-weight: 200;
      letter-spacing: -.035em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .date {
      margin-top: 14px;
      font-size: 17px;
      color: rgba(244, 237, 230, .7);
    }

    .hint {
      position: fixed; left: 0; right: 0; top: 22px;
      text-align: center;
      font-size: 13px;
      letter-spacing: .06em;
      color: rgba(244, 237, 230, .45);
      animation: nudge 2.8s ease-in-out infinite;
    }
    @keyframes nudge { 50% { transform: translateY(-4px); } }

    /* Bookmarks as glassy tiles under the clock */
    .marks {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
      max-width: min(860px, 90vw);
      margin: 46px auto 0;
    }
    .marks:empty { display: none; }
    .mark {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      width: 96px; padding: 16px 8px 12px;
      border-radius: 16px;
      color: inherit; text-decoration: none;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .08);
      backdrop-filter: blur(14px);
      transition: background-color .15s ease, transform .15s ease;
    }
    .mark:hover { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }
    .mark .ico {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(19, 17, 22, .55);
      font-size: 17px; font-weight: 600; color: var(--sand);
    }
    .mark .ico img { width: 22px; height: 22px; border-radius: 4px; }
    .mark .name {
      width: 100%; font-size: 12.5px; color: rgba(244, 237, 230, .82);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mark .del {
      position: absolute; top: 5px; right: 5px;
      display: none; place-items: center;
      width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
      background: rgba(19, 17, 22, .8); color: #f4ede6; font: 13px/1 sans-serif; cursor: pointer;
    }
    .mark:hover .del { display: grid; }
    .mark .del:hover { background: #c42b1c; }

    .private-note {
      display: none; max-width: 520px; margin: 26px auto 0;
      font-size: 14px; line-height: 1.55; color: rgba(244, 237, 230, .62);
    }
    body.private .private-note { display: block; }
    .private-badge {
      display: none; align-items: center; gap: 8px; margin: 0 auto 18px; width: max-content;
      padding: 6px 14px 6px 10px; border-radius: 999px;
      background: rgba(155, 108, 240, .18); color: #d9c8ff; font-size: 13px; letter-spacing: .04em;
    }
    .private-badge svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    body.private .private-badge { display: flex; }
    .all-marks {
      display: none; margin-top: 14px; font-size: 13px; color: rgba(244, 237, 230, .55); text-decoration: none;
    }
    .all-marks:hover { color: rgba(244, 237, 230, .9); }
    .marks:not(:empty) + .all-marks { display: inline-block; }

    main { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

    @media (prefers-reduced-motion: reduce) {
      .blob, .hint, main { animation: none; }
      .mark { transition: none; }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <div class="private-badge">
      <svg viewBox="0 0 24 24"><path d="M3.5 10.5c2.5-1 5.3-1.5 8.5-1.5s6 .5 8.5 1.5"/><path d="M6 10l1.6-4.2a1.5 1.5 0 0 1 1.9-.9L12 6l2.5-1.1a1.5 1.5 0 0 1 1.9.9L18 10"/><circle cx="8" cy="15.5" r="2.6"/><circle cx="16" cy="15.5" r="2.6"/><path d="M10.6 15.3h2.8"/></svg>
      Private window
    </div>
    <div class="greeting" id="greeting">Hello</div>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
    <p class="private-note">Pages you visit in this window aren't added to history, and cookies and site data are deleted
      when you close all private windows. Bookmarks and downloads you make are still kept.</p>
    <nav class="marks" id="marks" aria-label="Bookmarks"></nav>
    <a class="all-marks" href="bookmarks.html">All bookmarks →</a>
  </main>

  <div class="hint">↑ Search or type an address above</div>

  <script src="common.js"></script>
  <script>
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const greetingEl = document.getElementById('greeting');
    const marksEl = document.getElementById('marks');
    const MAX_TILES = 12;
    let bookmarks = [];
    let showMarks = true;

    if (location.search.includes('private')) document.body.classList.add('private');

    function tick() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
      const h = now.getHours();
      greetingEl.textContent =
        h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    }
    tick();
    setInterval(tick, 1000);

    // Bookmarks come from Bro. Add one with the bookmark button or Ctrl+D.
    function renderMarks() {
      const items = showMarks ? bookmarks.slice(0, MAX_TILES) : [];
      marksEl.replaceChildren(...items.map((b) => {
        const ico = el('span', { class: 'ico' });
        if (b.favicon) ico.append(el('img', { src: b.favicon, alt: '' }));
        else ico.textContent = (hostOf(b.url) || b.title || '?').charAt(0).toUpperCase();
        const del = el('button', { class: 'del', title: 'Remove bookmark' }, '×');
        del.addEventListener('click', (e) => {
          e.preventDefault();
          bro.send('removeBookmark', { id: b.id });
        });
        return el('a', { class: 'mark', href: b.url, title: `${b.title}\n${b.url}` },
          ico, el('span', { class: 'name' }, b.title || hostOf(b.url)), del);
      }));
    }

    bro.on('bookmarks', (m) => { bookmarks = m.items || []; renderMarks(); });
    bro.on('settings', (m) => {
      document.body.classList.toggle('no-clock', !m.settings.newTabClock);
      showMarks = m.settings.newTabBookmarks;
      renderMarks();
    });
    bro.get('settings', 'bookmarks');
  </script>
</body>
</html>
