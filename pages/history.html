<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>History</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <nav class="side">
    <div class="brand"><img src="logo.png" alt="">bro!</div>
    <a href="history.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</a>
    <a href="bookmarks.html"><svg viewBox="0 0 24 24"><path d="M7 4.5h10v15.5l-5-3.8-5 3.8z"/></svg>Bookmarks</a>
    <a href="downloads.html"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>Downloads</a>
    <a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg>Settings</a>
  </nav>

  <main>
    <div class="head">
      <h1>History</h1>
      <input class="search" id="q" type="search" placeholder="Search history" autocomplete="off" spellcheck="false">
      <a class="btn" href="settings.html#privacy" style="display:grid;place-items:center">Clear browsing data</a>
    </div>
    <div id="out"></div>
    <button class="btn more" id="more" hidden>Show more</button>
  </main>

  <script src="common.js"></script>
  <script>
    const out = document.getElementById('out');
    const q = document.getElementById('q');
    const moreBtn = document.getElementById('more');
    let limit = 300;
    let timer = 0;

    function request() { bro.send('history', { query: q.value.trim(), limit }); }

    function render(items) {
      out.replaceChildren();
      if (items.length === 0) {
        out.append(el('div', { class: 'empty' },
          el('b', {}, q.value.trim() ? 'No matches' : 'No history yet'),
          q.value.trim() ? 'Try a different word.' : 'Pages you visit will show up here.'));
        moreBtn.hidden = true;
        return;
      }
      let list = null, lastDay = '';
      for (const v of items) {
        const day = dayLabel(v.time);
        if (day !== lastDay) {
          lastDay = day;
          list = el('div', { class: 'list' });
          out.append(el('h2', {}, day), list);
        }
        list.append(el('div', { class: 'row' },
          el('span', { class: 'time' }, timeLabel(v.time)),
          siteIcon(v.url, v.favicon),
          el('div', { class: 'main' },
            el('a', { class: 'title', href: v.url, title: v.url }, v.title || hostOf(v.url)),
            el('span', { class: 'sub' }, hostOf(v.url))),
          el('div', { class: 'actions' },
            iconButton('x', 'Remove from history', () => bro.send('removeVisit', { id: v.id }), 'danger'))));
      }
      moreBtn.hidden = items.length < limit;
    }

    bro.on('history', (m) => { if (m.query === q.value.trim()) render(m.items); });
    bro.on('historyChanged', () => { clearTimeout(timer); timer = setTimeout(request, 300); });
    q.addEventListener('input', () => { clearTimeout(timer); limit = 300; timer = setTimeout(request, 150); });
    moreBtn.addEventListener('click', () => { limit += 500; request(); });

    bro.get('settings');
    request();
    q.focus();
  </script>
</body>
</html>
