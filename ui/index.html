<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bro!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The page (a Chromium view per tab) is placed exactly over this box -->
  <div id="viewport"></div>

  <!-- Bookmarks drawer (opens between the page and the tab rail) -->
  <aside id="drawer" aria-label="Bookmarks">
    <div class="drawer-head">
      <b>Bookmarks</b>
      <button class="icon-btn small" id="bm-new-folder" title="New folder">
        <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
      </button>
      <button class="icon-btn small" id="bm-close" title="Close">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
    <input id="bm-search" class="drawer-search" type="search" placeholder="Search bookmarks" spellcheck="false" autocomplete="off">
    <button id="bm-add" class="drawer-add"></button>
    <div id="bm-list" class="drawer-list"></div>
    <p class="drawer-hint">Drag bookmarks onto a folder to file them. Middle-click opens in a new tab.</p>
  </aside>

  <!-- Vertical tabs on the right -->
  <aside id="rail">
    <div class="rail-main">
      <div id="tabs" role="tablist" aria-orientation="vertical"></div>
      <button id="new-tab" class="new-tab" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="bm-toggle" class="new-tab" title="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M7.5 4.5h9v15l-4.5-3.4-4.5 3.4z"/></svg>
      </button>
    </div>
    <div id="sound" hidden>
      <div class="sound-head" title="Tabs playing sound">
        <svg viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      </div>
      <div id="sound-tabs"></div>
    </div>
    <div id="drop-line" hidden></div>
  </aside>

  <!-- Dropdowns. The page cuts a hole where one is open, so they appear on top of it. -->
  <div id="adblock-pop" class="popover" hidden>
    <div class="pop-head">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.1z"/></svg>
      <div class="pop-title"><b>Ad blocker</b><small id="ab-site"></small></div>
      <label class="switch" title="Block ads on this site"><input type="checkbox" id="ab-toggle"><span></span></label>
    </div>
    <div class="pop-big" id="ab-count"></div>
    <div class="pop-list" id="ab-hosts"></div>
    <div class="pop-foot">
      <small id="ab-status"></small>
      <button class="link-btn" id="ab-settings">Settings</button>
    </div>
  </div>

  <div id="zoom-pop" class="popover" hidden>
    <div class="zoom-row">
      <button class="icon-btn small" id="zoom-out" title="Zoom out (Ctrl+minus)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <span class="value" id="zoom-pop-value">100%</span>
      <button class="icon-btn small" id="zoom-in" title="Zoom in (Ctrl+plus)"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      <button class="reset" id="zoom-reset" title="Reset (Ctrl+0)">Reset</button>
    </div>
  </div>

  <div id="volume-pop" class="popover" hidden>
    <button class="pop-tab" id="vol-tab" title="Show this tab"><span class="ico" id="vol-ico"></span><span id="vol-title"></span></button>
    <div class="vol-row">
      <button class="icon-btn small" id="vol-mute" title="Mute"></button>
      <input type="range" id="vol-range" min="0" max="100" step="1">
      <span class="vol-value" id="vol-value"></span>
    </div>
  </div>

  <!-- Top toolbar -->
  <header id="bar">
    <div class="brand"><img class="logo" src="logo.png" alt="">bro!<span class="private-tag" title="Private window">private</span></div>

    <nav class="nav">
      <button id="back" class="icon-btn" title="Back (Alt+Left)">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Forward (Alt+Right)">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button id="reload" class="icon-btn" title="Reload (F5)">
        <svg class="i-reload" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.5H15"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </nav>

    <label class="addr" id="addr">
      <span class="addr-icon" id="addr-icon"></span>
      <span class="addr-field">
        <input id="addr-input" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
        <span id="addr-display" aria-hidden="true"></span>
      </span>
      <button id="zoom" class="zoom-btn" type="button" title="Zoom" hidden>
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5"/><path class="plus" d="M10.5 8v5"/></svg>
        <span id="zoom-value">100%</span>
      </button>
    </label>

    <div class="tools">
      <button id="bookmark" class="icon-btn" title="Bookmark this page (Ctrl+D)">
        <svg viewBox="0 0 24 24"><path d="M7 4.5h10v15.5l-5-3.8-5 3.8z"/></svg>
      </button>
      <button id="shield" class="icon-btn" title="Ad blocker">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.1z"/><path class="slash" d="M5 5l14 14"/></svg>
        <span class="count" id="blocked"></span>
      </button>
      <button id="downloads" class="icon-btn" title="Downloads (Ctrl+J)">
        <svg viewBox="0 0 24 24"><path d="M12 4.5v10M7.5 10.5l4.5 4.5 4.5-4.5M5.5 19.5h13"/></svg>
        <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19.5" pathLength="100"/></svg>
      </button>
      <button id="more" class="icon-btn" title="Menu">
        <svg viewBox="0 0 24 24" class="filled"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>

    <!-- Window buttons -->
    <div class="window-btns">
      <button data-cmd="minimize" title="Minimize">
        <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
      </button>
      <button data-cmd="toggleMax" id="max-btn" title="Maximize">
        <svg class="i-max" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>
        <svg class="i-restore" viewBox="0 0 16 16"><rect x="3.5" y="5.5" width="7" height="7" rx="1.5"/><path d="M5.5 5.5v-.5a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-.5"/></svg>
      </button>
      <button data-cmd="close" class="close" title="Close">
        <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <script src="app.js"></script>
</body>
</html>
